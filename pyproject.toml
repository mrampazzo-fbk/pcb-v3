[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcb-v3"
version = "0.1.0"
description = "PCB_v3 dataset generation: single, variable and catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "esatan-launcher",
    "esatan-results-reader",
    "numpy",
    "h5py>=3.10",
]

[project.scripts]
pcb-v3 = "pcb_v3.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/pcb_v3"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "pyproject.toml", "uv.lock"]

[tool.uv.sources]
esatan-launcher = { git = "ssh://git@gitlab.fbk.eu/hyres/aisa/esatan-launcher.git" }
esatan-results-reader = { git = "ssh://git@gitlab.fbk.eu/hyres/aisa/esatan-results-reader.git" }

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
